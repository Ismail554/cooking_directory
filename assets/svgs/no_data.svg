<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bookCoverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF833A"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>
  <!-- Ground soft shadow -->
  <ellipse cx="100" cy="172" rx="72" ry="12" fill="#E5E0D8" opacity="0.8"/>
  
  <!-- Open Recipe Book / Binder -->
  <!-- Left Page Back / Cover -->
  <path d="M 28 62 Q 64 68 96 74 L 96 148 Q 64 142 28 136 Z" fill="url(#bookCoverGrad)" stroke="#AC1900" stroke-width="2"/>
  <!-- Right Page Back / Cover -->
  <path d="M 172 62 Q 136 68 104 74 L 104 148 Q 136 142 172 136 Z" fill="url(#bookCoverGrad)" stroke="#AC1900" stroke-width="2"/>
  
  <!-- Left Page Surface (Linen / White) -->
  <path d="M 32 58 Q 64 64 96 70 L 96 142 Q 64 136 32 130 Z" fill="#FBF9F6" stroke="#E5E0D8" stroke-width="1.5"/>
  <!-- Right Page Surface (Linen / White) -->
  <path d="M 168 58 Q 136 64 104 70 L 104 142 Q 136 136 168 130 Z" fill="#FBF9F6" stroke="#E5E0D8" stroke-width="1.5"/>
  
  <!-- Spine crease -->
  <line x1="100" y1="68" x2="100" y2="146" stroke="#AC1900" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Empty placeholder dotted lines on left page -->
  <line x1="44" y1="80" x2="84" y2="86" stroke="#E5E0D8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="44" y1="96" x2="84" y2="102" stroke="#E5E0D8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="44" y1="112" x2="76" y2="117" stroke="#E5E0D8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- Empty placeholder dotted lines on right page -->
  <line x1="116" y1="86" x2="156" y2="80" stroke="#E5E0D8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="116" y1="102" x2="156" y2="96" stroke="#E5E0D8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="116" y1="117" x2="146" y2="112" stroke="#E5E0D8" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4"/>
  
  <!-- Magnifying glass overlay searching the empty pages -->
  <g transform="translate(112, 90) rotate(-25)">
    <!-- Glass Lens -->
    <circle cx="0" cy="0" r="24" fill="#FFE0B2" fill-opacity="0.35" stroke="#FFA000" stroke-width="4"/>
    <!-- Inner reflection -->
    <path d="M -16 -6 A 18 18 0 0 1 6 -16" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Handle -->
    <rect x="-3" y="24" width="6" height="26" rx="3" fill="#E65100" stroke="#AC1900" stroke-width="1.5"/>
  </g>
  
  <!-- Sparkles / Stars in Saffron -->
  <!-- Sparkle 1 (Top Left) -->
  <path d="M 46 36 Q 46 44 38 44 Q 46 44 46 52 Q 46 44 54 44 Q 46 44 46 36 Z" fill="#FFA000"/>
  <!-- Sparkle 2 (Top Right) -->
  <path d="M 156 32 Q 156 42 146 42 Q 156 42 156 52 Q 156 42 166 42 Q 156 42 156 32 Z" fill="#FFA000"/>
  <!-- Small star dot -->
  <circle cx="166" cy="68" r="3" fill="#FFD54F"/>
  <circle cx="34" cy="74" r="2.5" fill="#FFD54F"/>
</svg>
