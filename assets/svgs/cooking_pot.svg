<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF833A"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
  </defs>
  <!-- Ground shadow -->
  <ellipse cx="50" cy="92" rx="36" ry="5" fill="#E5E0D8" opacity="0.8"/>
  
  <!-- Side handles -->
  <rect x="8" y="55" width="10" height="8" rx="4" fill="#AC1900"/>
  <rect x="82" y="55" width="10" height="8" rx="4" fill="#AC1900"/>
  
  <!-- Pot base / body -->
  <path d="M 15 50 L 18 80 Q 20 88 50 88 Q 80 88 82 80 L 85 50 Z" fill="url(#potGrad)" stroke="#AC1900" stroke-width="2"/>
  
  <!-- Lid rim -->
  <ellipse cx="50" cy="50" rx="35" ry="6" fill="#AC1900"/>
  <ellipse cx="50" cy="48" rx="34" ry="5" fill="url(#potGrad)"/>
  
  <!-- Lid dome -->
  <path d="M 20 48 Q 50 32 80 48" fill="url(#lidGrad)" stroke="#AC1900" stroke-width="1.5"/>
  
  <!-- Lid knob / handle -->
  <rect x="46" y="32" width="8" height="6" rx="2" fill="#FFA000" stroke="#AC1900" stroke-width="1"/>
  <circle cx="50" cy="30" r="5" fill="#FFA000" stroke="#AC1900" stroke-width="1.2"/>
  
  <!-- Rising steam paths -->
  <path d="M 38 26 C 32 20 44 14 38 8" fill="none" stroke="#FF833A" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 50 23 C 44 17 56 11 50 5" fill="none" stroke="#FFA000" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M 62 26 C 68 20 56 14 62 8" fill="none" stroke="#FF833A" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
